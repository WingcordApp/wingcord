# The reports Worker's type check and tests (ReportsWorker/, docs/BUG-REPORTING.md
# §9), whenever it changes: Linux, about a minute. The tests use their own
# keys and fakes — no secret is needed, and nothing is deployed.
name: Reports Worker

on:
  push:
    paths:
      - "ReportsWorker/**"
      - ".github/workflows/reports-worker.yml"
  pull_request:
    paths:
      - "ReportsWorker/**"
      - ".github/workflows/reports-worker.yml"

permissions:
  contents: read

concurrency:
  group: reports-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ReportsWorker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ReportsWorker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
